name: Auto-Update Drivers

on:
  schedule:
    - cron: '18 11 * * 1'  # Každou neděli v 00:00 UTC
  workflow_dispatch: {}   # umožní ruční spuštění pro test

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Download driver
        run: node scripts/download-driver.js

      - name: Extract driver into drivers/
        run: |
          set -euo pipefail
          rm -rf drivers
          mkdir -p drivers
          unzip -o driver_package.zip -d drivers/
          rm driver_package.zip

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add drivers/
          git diff --cached --quiet && echo "Žádné změny" || git commit -m "Auto-update: Konica Minolta bizhub C220 driver"
          git push
